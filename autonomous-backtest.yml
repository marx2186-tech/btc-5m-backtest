name: Autonomous crypto backtest service

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request_json:
        description: JSON backtest request
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: autonomous-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[BACKTEST]') ||
      startsWith(github.event.comment.body, '/backtest')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse request
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: python service/controller.py

      - name: Download, audit and autonomously optimize
        env:
          PYTHONHASHSEED: '0'
          NUMBA_NUM_THREADS: '2'
        run: python autonomous_backtest.py

      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 30

      - name: Save result history and latest result
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          mkdir -p "history/$stamp"
          cp -R results/. "history/$stamp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ history/ request.json
          git commit -m "Add autonomous backtest result $stamp [skip ci]" || true
          git push

      - name: Post final result to control issue
        if: github.event.issue.number != null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python service/issue_summary.py > issue-result.md
          gh issue comment "${{ github.event.issue.number }}" --body-file issue-result.md
