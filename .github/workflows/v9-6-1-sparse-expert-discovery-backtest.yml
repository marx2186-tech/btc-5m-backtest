name: BTC 5m V9.6.1 sparse expert discovery backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_6_1.py"
      - "request.v9_6_1.json"
      - "_v961_base_engine.py"
      - ".github/workflows/v9-6-1-sparse-expert-discovery-backtest.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-6-1-sparse-expert-discovery
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.6.1 files
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_6_1.py
          test -f request.v9_6_1.json
          test -f _v961_base_engine.py
          test -f .github/workflows/v9-6-1-sparse-expert-discovery-backtest.yml
          test "$(sha256sum autonomous_backtest_v9_6_1.py | awk '{print $1}')" = "40c0980b52c7f571a10792a4a6779cff2071852e403c80eb743d53d112f7650c"
          test "$(sha256sum request.v9_6_1.json | awk '{print $1}')" = "782eac83a86028fc8d48599d512243f1dbcf81700ea396f3940eb75859061ce8"
          test "$(sha256sum _v961_base_engine.py | awk '{print $1}')" = "4a21efd05d38a95a57717c0c9dc251009ed6b659affb35264f24b822a233e846"
          grep -F 'ENGINE_VERSION = "V9.6.1"' autonomous_backtest_v9_6_1.py
          grep -F 'RESULTS = ROOT / "results_v9_6_1"' autonomous_backtest_v9_6_1.py
          grep -F 'SparseExpert(31' autonomous_backtest_v9_6_1.py
          grep -F 'def select_experts' autonomous_backtest_v9_6_1.py
          grep -F 'meta_decision' autonomous_backtest_v9_6_1.py
          grep -F 'qualified_portfolio_trades.csv' autonomous_backtest_v9_6_1.py

      - name: Syntax and offline architecture tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_6_1.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_6_1.py _v961_base_engine.py
          python autonomous_backtest_v9_6_1.py --self-test 2>&1 | tee v9-6-1-self-test.log
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import yaml
          request=json.loads(Path('request.v9_6_1.json').read_text(encoding='utf-8'))
          assert request['historical_start']=='2025-01'
          assert request['development_start']=='2025-05'
          assert request['qualified_gate']['min_total_trades']==10
          assert request['watch_gate']['min_total_trades']==6
          assert request['candidate_gate']['min_total_trades']==3
          assert request['model']['meta_hard_reject_probability']==0.30
          assert request['portfolio']['qualified_min_experts']==3
          parsed=yaml.safe_load(Path('.github/workflows/v9-6-1-sparse-expert-discovery-backtest.yml').read_text(encoding='utf-8'))
          assert 'jobs' in parsed and 'backtest' in parsed['jobs']
          print('V961_CONFIG_AND_YAML_OK')
          PYCODE

      - name: Run V9.6.1 real backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_6_1.json
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python autonomous_backtest_v9_6_1.py 2>&1 | tee v9-6-1-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-6-1-failure-diagnostics
          path: |
            v9-6-1-self-test.log
            v9-6-1-run.log
            results_v9_6_1/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.6.1 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in status.json report.md research_portfolio_trades.csv qualified_portfolio_trades.csv portfolio_trades.csv trades.csv expert_shadow_trades.csv sparse_expert_leaderboard.csv expert_monthly_stats.csv expert_overlap.csv opportunity_coverage.csv selection_audit.csv expert_tier_audit.csv signal_funnel.csv soft_meta_audit.csv cross_month_score_drift.csv signal_deduplication.csv signal_conflicts.csv selected_policy.json data_audit.json run_identity.txt; do
            test -f "results_v9_6_1/$f"
          done
          grep -F 'BTC 5m sparse expert discovery and soft-meta pool V9.6.1' results_v9_6_1/run_identity.txt
          grep -F 'oos=2026-06' results_v9_6_1/run_identity.txt
          python - <<'PYCODE'
          import json
          from pathlib import Path
          s=json.loads(Path('results_v9_6_1/status.json').read_text(encoding='utf-8'))
          assert s['engine']=='BTC 5m sparse expert discovery and soft-meta pool V9.6.1'
          assert s['qualified'] is False
          assert s['not_for_live_trading'] is True
          assert s['fresh_blind_month_required'] is True
          assert s['searched_experts']==32
          assert len(s['development_months'])==13
          assert s['oos_isolation']['used_for_training'] is False
          assert s['oos_isolation']['used_for_expert_selection'] is False
          assert s['selection_status'] in {'QUALIFIED_EXPERT_POOL_AVAILABLE','RESEARCH_EXPERT_POOL_ONLY','ZERO_POSITIVE_SPARSE_EXPERTS'}
          assert sum(s['tier_counts'].values())==32
          print(json.dumps({'tiers':s['tier_counts'],'research':s['research_portfolio_monthly_stats'],'qualified':s['qualified_portfolio_monthly_stats']},ensure_ascii=False,indent=2))
          PYCODE

      - name: Upload V9.6.1 results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-6-1-results
          path: results_v9_6_1/
          retention-days: 30

      - name: Commit readable V9.6.1 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_6_1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V9.6.1 sparse expert result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
