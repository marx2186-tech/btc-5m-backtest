name: BTC 5m V9.1 signal-funnel backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_1.py"
      - "request.v9_1.json"
      - ".github/workflows/v9-1-signal-funnel-backtest.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-1-signal-funnel
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.1 source and request
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_1.py
          test -f request.v9_1.json
          test -f .github/workflows/v9-1-signal-funnel-backtest.yml
          script_actual="$(sha256sum autonomous_backtest_v9_1.py | awk '{print $1}')"
          request_actual="$(sha256sum request.v9_1.json | awk '{print $1}')"
          script_expected="902c2bfc592afc375a9d5b3649465a15257e70dff738ac39fd5a3fbdf2bab430"
          request_expected="bd846ef1d624ae4739b4cc0aeaeaba6667bd655f643e923f72be348bbbcccc9c"
          echo "script_sha256=$script_actual"
          echo "request_sha256=$request_actual"
          test "$script_actual" = "$script_expected"
          test "$request_actual" = "$request_expected"
          grep -F 'ENGINE_VERSION = "V9.1"' autonomous_backtest_v9_1.py
          grep -F 'RESULTS = ROOT / "results_v9_1"' autonomous_backtest_v9_1.py
          grep -F 'OOS_MONTH = "2026-06"' autonomous_backtest_v9_1.py
          grep -F 'static_signal_funnel' autonomous_backtest_v9_1.py
          grep -F 'consecutive_zero_opportunity_months' autonomous_backtest_v9_1.py
          grep -F 'EXPERIMENTAL_FALLBACK' autonomous_backtest_v9_1.py
          grep -F 'assert_oos_isolation' autonomous_backtest_v9_1.py

      - name: Python syntax and offline regression tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_1.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_1.py
          python autonomous_backtest_v9_1.py --self-test 2>&1 | tee v9-1-self-test.log
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = Path('.github/workflows/v9-1-signal-funnel-backtest.yml')
          parsed = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          assert isinstance(parsed, dict)
          assert 'jobs' in parsed and 'backtest' in parsed['jobs']
          print('YAML_PARSE_OK')
          PY

      - name: Run V9.1 backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_1.json
        run: |
          set -o pipefail
          python autonomous_backtest_v9_1.py 2>&1 | tee v9-1-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-1-failure-diagnostics
          path: |
            v9-1-self-test.log
            v9-1-run.log
            results_v9_1/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.1 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f results_v9_1/status.json
          test -f results_v9_1/report.md
          test -f results_v9_1/trades.csv
          test -f results_v9_1/candidate_leaderboard.csv
          test -f results_v9_1/expert_candidate_leaderboard.csv
          test -f results_v9_1/signal_funnel.csv
          test -f results_v9_1/signal_funnel.json
          test -f results_v9_1/selected_policy.json
          test -f results_v9_1/data_audit.json
          test -f results_v9_1/run_identity.txt
          grep -F 'BTC 5m signal-funnel layered expert ensemble V9.1' results_v9_1/run_identity.txt
          grep -F 'oos=2026-06' results_v9_1/run_identity.txt
          grep -F 'output=results_v9_1' results_v9_1/run_identity.txt
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('results_v9_1/status.json').read_text(encoding='utf-8'))
          assert status['engine'] == 'BTC 5m signal-funnel layered expert ensemble V9.1'
          assert status['oos_month'] == '2026-06'
          assert status['selection_status'] in {'VALID_POLICY', 'EXPERIMENTAL_FALLBACK'}
          if status['selection_status'] == 'EXPERIMENTAL_FALLBACK':
              assert status['not_for_live_trading'] is True
              assert status['qualified'] is False
          isolation = status['oos_isolation']
          assert isolation['used_for_training'] is False
          assert isolation['used_for_thresholds'] is False
          assert isolation['used_for_expert_elimination'] is False
          assert isolation['used_for_combination_selection'] is False
          assert isolation['evaluation_occurs_after_policy_freeze'] is True
          assert isolation['oos_funnel_diagnostics_computed_after_policy_freeze'] is True
          assert status['constraints']['fee_rate_per_side'] == 0.0005
          assert status['constraints']['slippage_per_fill_usdt'] == 0.2
          assert set(status['expert_stats']) == {'2026-05', '2026-06'}
          print(json.dumps(status['monthly_stats'], ensure_ascii=False, indent=2))
          PY

      - name: Upload V9.1 result artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-1-results
          path: results_v9_1/
          retention-days: 30

      - name: Commit readable V9.1 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_1
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Add V9.1 signal-funnel result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
