name: BTC 5m V9.6.4 snapshot and statistical validation backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_6_4.py"
      - "_v964_strategy_core.py"
      - "_v961_reference_strategy.py"
      - "_v964_base_engine.py"
      - "request.v9_6_4.json"
      - ".github/workflows/v9-6-4-snapshot-statistical-validation-backtest.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-6-4-snapshot-statistical-validation
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.6.4 files
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_6_4.py
          test -f _v964_strategy_core.py
          test -f _v961_reference_strategy.py
          test -f _v964_base_engine.py
          test -f request.v9_6_4.json
          test "$(sha256sum autonomous_backtest_v9_6_4.py | awk '{print $1}')" = "f5f0d4320c561034977fddcd1c6c5ed76cb9cbe229961e7d9bd3393c2bb2ff4a"
          test "$(sha256sum _v964_strategy_core.py | awk '{print $1}')" = "b81ae5a64f5a9d50a13afbf8197143d5853837f4bfa99fedec06ba00e26d9809"
          test "$(sha256sum _v961_reference_strategy.py | awk '{print $1}')" = "b81cb72625ec912da55b6946eaa222b0edc9b07376d4e5e086da4426297c6e68"
          test "$(sha256sum _v964_base_engine.py | awk '{print $1}')" = "3054c5ac297b41c930a0b3321c54b04527d8f9a1fa190eb859d1ab21347bfde9"
          test "$(sha256sum request.v9_6_4.json | awk '{print $1}')" = "1661812ba85c0c893929d4f9d95ab28150a3743347a6121076f225833edeaefc"
          grep -F 'V9.6.4' autonomous_backtest_v9_6_4.py
          grep -F 'monthly_sample_validity.csv' autonomous_backtest_v9_6_4.py
          grep -F 'snapshot_replay_audit.json' autonomous_backtest_v9_6_4.py
          grep -F 'v961_vs_v964_signal_diff.csv' autonomous_backtest_v9_6_4.py

      - name: Syntax and offline tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_6_4.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_6_4.py _v964_strategy_core.py _v961_reference_strategy.py _v964_base_engine.py
          python autonomous_backtest_v9_6_4.py --self-test 2>&1 | tee v9-6-4-self-test.log
          python autonomous_backtest_v9_6_4.py --pipeline-smoke 2>&1 | tee v9-6-4-pipeline-smoke.log
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import yaml
          r=json.loads(Path('request.v9_6_4.json').read_text(encoding='utf-8'))
          assert r['statistical_validation']['monthly_valid_min_trades']==5
          assert r['statistical_validation']['block_months']==3
          assert r['statistical_validation']['wilson_z']==1.96
          assert r['watch_gate']['min_total_trades']==8
          assert r['qualified_gate']['min_total_trades']==15
          assert r['snapshot_reproduction']['historical_policy_key']=='fca571982b7c88a0'
          y=yaml.safe_load(Path('.github/workflows/v9-6-4-snapshot-statistical-validation-backtest.yml').read_text(encoding='utf-8'))
          assert 'backtest' in y['jobs']
          print('V964_CONFIG_AND_YAML_OK')
          PYCODE

      - name: Run V9.6.4 real backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_6_4.json
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python autonomous_backtest_v9_6_4.py 2>&1 | tee v9-6-4-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-6-4-failure-diagnostics
          path: |
            v9-6-4-self-test.log
            v9-6-4-pipeline-smoke.log
            v9-6-4-run.log
            results_v9_6_4/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.6.4 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in status.json report.md run_identity.txt expert_tier_audit.csv expert_shadow_trades.csv monthly_sample_validity.csv time_block_validation.csv bayesian_win_rate_audit.csv best_trade_removal_audit.csv leave_one_month_out_audit.csv profit_concentration_audit.csv blind_evidence_progress.json strategy_snapshot.json snapshot_replay_audit.json v961_reference_reproduction.json v961_vs_v964_signal_diff.csv watch_portfolio_trades.csv research_portfolio_trades.csv qualified_portfolio_trades.csv candidate_shadow_trades.csv candidate_support_only_trades.csv sparse_expert_leaderboard.csv parameter_cluster_audit.csv policy_selection_comparison.csv seed_policy_comparison.csv signal_funnel.csv soft_meta_audit.csv selected_policy.json data_audit.json; do
            test -f "results_v9_6_4/$f"
          done
          python - <<'PYCODE'
          import json
          from pathlib import Path
          s=json.loads(Path('results_v9_6_4/status.json').read_text(encoding='utf-8'))
          r=json.loads(Path('results_v9_6_4/snapshot_replay_audit.json').read_text(encoding='utf-8'))
          b=json.loads(Path('results_v9_6_4/blind_evidence_progress.json').read_text(encoding='utf-8'))
          assert s['engine']=='BTC 5m full snapshot reproduction and sparse evidence validation V9.6.4'
          assert s['qualified'] is False and s['not_for_live_trading'] is True
          assert s['statistical_validation_enabled'] is True
          assert s['monthly_raw_win_rate_is_not_validation'] is True
          assert r['exact_match'] is True
          assert b['rule']=='minimum calendar months AND minimum trades must both be met'
          assert sum(s['tier_counts'].values())==40
          print(json.dumps({'tiers':s['tier_counts'],'snapshot_replay_exact':s['snapshot_replay_exact'],'v961_reference_exact':s['v961_reference_exact_summary_match']},ensure_ascii=False,indent=2))
          PYCODE

      - name: Upload V9.6.4 results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-6-4-results
          path: results_v9_6_4/
          retention-days: 30

      - name: Commit readable V9.6.4 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_6_4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V9.6.4 snapshot statistical validation result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
