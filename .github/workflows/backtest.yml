name: BTC 5m backtest and optimization

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest.py"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download, audit and optimize
        env:
          PYTHONHASHSEED: "0"
          NUMBA_NUM_THREADS: "2"
        run: python backtest.py

      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-backtest-results
          path: results/
          retention-days: 30

      - name: Commit readable results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add BTC 5m optimization results [skip ci]"
            git push
          fi
