name: BTC 5m V9.4 dual-core structure-locked backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_4.py"
      - "request.v9_4.json"
      - ".github/workflows/v9-4-dual-core-structure-locked-backtest.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-4-dual-core-structure-locked
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.4 source and request
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_4.py
          test -f request.v9_4.json
          test -f .github/workflows/v9-4-dual-core-structure-locked-backtest.yml
          script_actual="$(sha256sum autonomous_backtest_v9_4.py | awk '{print $1}')"
          request_actual="$(sha256sum request.v9_4.json | awk '{print $1}')"
          script_expected="d6a70123572a722286a37b52b83aebb16f64772467f8eb9edc8dd3100b4012e1"
          request_expected="f48805851a57f9eae8266e9396d0fb8231bf9869af7dcd4aa1c6118c1197921a"
          echo "script_sha256=$script_actual"
          echo "request_sha256=$request_actual"
          test "$script_actual" = "$script_expected"
          test "$request_actual" = "$request_expected"
          grep -F 'ENGINE_VERSION = "V9.4"' autonomous_backtest_v9_4.py
          grep -F 'RESULTS = ROOT / "results_v9_4"' autonomous_backtest_v9_4.py
          grep -F 'CORE_EXPERT_IDS != (1, 2)' autonomous_backtest_v9_4.py
          grep -F 'REQUIRE_NEW_STRUCTURE_CYCLE' autonomous_backtest_v9_4.py
          grep -F 'def quality_protection_test' autonomous_backtest_v9_4.py
          grep -F 'assert_oos_isolation' autonomous_backtest_v9_4.py

      - name: Python syntax and offline regression tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_4.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_4.py
          python autonomous_backtest_v9_4.py --self-test 2>&1 | tee v9-4-self-test.log
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          request = json.loads(Path('request.v9_4.json').read_text(encoding='utf-8'))
          assert request['core_expert_ids'] == [1, 2]
          assert request['research_stage']['min_trades'] == 8
          assert request['research_stage']['max_trades'] == 12
          assert request['require_new_structure_cycle_after_loss'] is True
          workflow = Path('.github/workflows/v9-4-dual-core-structure-locked-backtest.yml')
          parsed = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          assert isinstance(parsed, dict)
          assert 'jobs' in parsed and 'backtest' in parsed['jobs']
          print('V94_CONFIG_AND_YAML_OK')
          PY

      - name: Run V9.4 backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_4.json
        run: |
          set -o pipefail
          python autonomous_backtest_v9_4.py 2>&1 | tee v9-4-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-4-failure-diagnostics
          path: |
            v9-4-self-test.log
            v9-4-run.log
            results_v9_4/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.4 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for file in status.json report.md trades.csv candidate_leaderboard.csv expert_candidate_leaderboard.csv signal_funnel.csv signal_funnel.json selected_policy.json data_audit.json run_identity.txt; do
            test -f "results_v9_4/$file"
          done
          grep -F 'BTC 5m dual-core structure-locked expert ensemble V9.4' results_v9_4/run_identity.txt
          grep -F 'oos=2026-06' results_v9_4/run_identity.txt
          grep -F 'output=results_v9_4' results_v9_4/run_identity.txt
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('results_v9_4/status.json').read_text(encoding='utf-8'))
          assert status['engine'] == 'BTC 5m dual-core structure-locked expert ensemble V9.4'
          assert status['selection_status'] in {'CORE_RESEARCH_POLICY', 'EXPERIMENTAL_FALLBACK'}
          assert status['qualified'] is False
          assert status['not_for_live_trading'] is True
          assert status['fresh_blind_month_required'] is True
          assert status['constraints']['core_expert_ids'] == [1, 2]
          assert status['constraints']['research_stage']['min_trades'] == 8
          assert status['constraints']['research_stage']['max_trades'] == 12
          assert status['constraints']['max_trades_per_expert_per_day'] == 2
          assert status['constraints']['max_trades_per_setup_per_day'] == 1
          assert status['constraints']['loss_reentry_min_bars'] == 12
          assert status['constraints']['require_new_structure_cycle_after_loss'] is True
          selected = {item['expert_id'] for item in status['selected_expert_policies'].values()}
          assert selected.issubset({1, 2}) and selected
          assert set(status['diagnostic_only_experts']) == {'趋势多头', '震荡空头反转', '高波动多头突破', '高波动空头突破'}
          isolation = status['oos_isolation']
          assert isolation['used_for_training'] is False
          assert isolation['used_for_thresholds'] is False
          assert isolation['used_for_expert_elimination'] is False
          assert isolation['used_for_combination_selection'] is False
          assert isolation['evaluation_occurs_after_policy_freeze'] is True
          for audit in status['quality_protection_audit'].values():
            assert audit['max_trades_same_expert_day'] <= 2
            assert audit['max_trades_same_setup_day'] <= 1
          print(json.dumps(status['monthly_stats'], ensure_ascii=False, indent=2))
          PY

      - name: Upload V9.4 result artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-4-results
          path: results_v9_4/
          retention-days: 30

      - name: Commit readable V9.4 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_4
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Add V9.4 dual-core result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
