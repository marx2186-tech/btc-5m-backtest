name: BTC 5m V9.7.0 append-only blind evidence accumulation

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_7_0.py"
      - "_v970_strategy_core.py"
      - "_v961_reference_strategy.py"
      - "_v970_base_engine.py"
      - "request.v9_7_0.json"
      - ".github/workflows/v9-7-0-blind-evidence-accumulation.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-7-0-blind-evidence-accumulation
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.7.0 files
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_7_0.py
          test -f _v970_strategy_core.py
          test -f _v961_reference_strategy.py
          test -f _v970_base_engine.py
          test -f request.v9_7_0.json
          test "$(sha256sum autonomous_backtest_v9_7_0.py | awk '{print $1}')" = "995291a80bbfee4c3dcdfa86741c30b4c0d1196c6666b7a2e7598916a0fc683f"
          test "$(sha256sum _v970_strategy_core.py | awk '{print $1}')" = "01e91d9bbe364e45666278a00726cd9b46ad9ab445ecba171c6a4994dbac5714"
          test "$(sha256sum _v961_reference_strategy.py | awk '{print $1}')" = "1d4d662f4d6d621585b18ba84dd82efb501acd2f888481693f3f04cf0943e909"
          test "$(sha256sum _v970_base_engine.py | awk '{print $1}')" = "fddd93006b5909de458cb4127c86fd7b9abc3b5b10ed17d7f3365365cd6d46a6"
          test "$(sha256sum request.v9_7_0.json | awk '{print $1}')" = "2df90dc887800187d5c26b19370df17eaee6aa25428dd367a3eb02bff720d03a"
          grep -F 'build_unified_rating_shadow' autonomous_backtest_v9_7_0.py
          grep -F 'EXPERT_COVERAGE' autonomous_backtest_v9_7_0.py
          grep -F 'feature_frame_column_found' autonomous_backtest_v9_7_0.py
          grep -F 'V9.6.9_FROZEN_EXTENDED_FEATURES' autonomous_backtest_v9_7_0.py
          grep -F 'V9.6.9_FROZEN_EXTENDED_ORIGINAL' autonomous_backtest_v9_7_0.py
          grep -F 'rating_data_source_audit.json' autonomous_backtest_v9_7_0.py
          grep -F 'risk_budget_dual_track_validation.json' autonomous_backtest_v9_7_0.py
          grep -F 'expert_coverage' request.v9_7_0.json
          grep -F 'NO_WINNER_SELECTION_FROM_SEEN_OOS' autonomous_backtest_v9_7_0.py
          grep -F 'blind_accumulation_self_test' autonomous_backtest_v9_7_0.py
          grep -F 'blind_expert_trade_ledger.csv' autonomous_backtest_v9_7_0.py
          grep -F 'append_only_ledger' request.v9_7_0.json

      - name: Syntax and offline tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_7_0.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_7_0.py _v970_strategy_core.py _v961_reference_strategy.py _v970_base_engine.py
          python autonomous_backtest_v9_7_0.py --self-test 2>&1 | tee v9-7-0-self-test.log
          python autonomous_backtest_v9_7_0.py --pipeline-smoke 2>&1 | tee v9-7-0-pipeline-smoke.log
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import yaml

          r = json.loads(Path('request.v9_7_0.json').read_text(encoding='utf-8'))
          c = r['expert_coverage']
          required = set(map(int, c['required_expert_ids']))
          reference = set(map(int, c['v961_reference_ids']))
          extended = set(map(int, c['extended_original_ids']))
          assert r['release']['version'] == '9.7.0'
          assert r['release']['thresholds_changed'] is False
          assert r['blind_evidence']['start_month'] == '2026-07'
          assert r['blind_evidence']['winner_selection_enabled'] is False
          assert r['blind_evidence']['automatic_tier_activation_enabled'] is False
          assert r['release']['signal_logic_changed'] is False
          assert reference.isdisjoint(extended)
          assert reference | extended == required == set(range(40))
          assert reference == set(range(32))
          assert extended == set(range(32, 40))
          assert c['required_expert_count'] == 40
          assert c['require_complete_expert_coverage'] is True
          assert c['require_complete_policy_coverage'] is True
          g = r['expert_level_gating']
          assert g['signal_selection_independent_of_tier'] is True
          assert g['rating_ignores_execution_budget'] is True
          assert 'max_trades_per_month' in g['rating_gate_ignored_fields']
          assert r['rating_data_source']['forbid_core_fixed_penalty_shadow_for_final_tier'] is True
          assert r['v969_no_monthly_budget_lane']['monthly_cap_enabled'] is False
          assert r['v969_no_monthly_budget_lane']['cross_trade_cluster_dedup'] is False
          assert r['risk_budget_dual_track']['winner_selection_enabled'] is False
          assert r['quad_track_validation']['winner_selection_enabled'] is False
          y = yaml.safe_load(Path('.github/workflows/v9-7-0-blind-evidence-accumulation.yml').read_text(encoding='utf-8'))
          assert 'backtest' in y['jobs']
          print('V970_CONFIG_COVERAGE_AND_YAML_OK')
          PYCODE

      - name: Run V9.7.0 real backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_7_0.json
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python autonomous_backtest_v9_7_0.py 2>&1 | tee v9-7-0-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-7-0-failure-diagnostics
          path: |
            v9-7-0-self-test.log
            v9-7-0-pipeline-smoke.log
            v9-7-0-run.log
            results_v9_7_0/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.7.0 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in status.json report.md run_identity.txt expert_tier_audit.csv monthly_sample_validity.csv time_block_validation.csv bayesian_win_rate_audit.csv best_trade_removal_audit.csv leave_one_month_out_audit.csv profit_concentration_audit.csv blind_evidence_progress.json strategy_snapshot.json snapshot_replay_audit.json v961_reference_reproduction.json signal_stage_attribution.csv quad_track_validation.json quad_lane_candidate_diff.csv signal_selection_independence_audit.json expert_level_gate_audit.csv v969_unified_rating_shadow_trades.csv v969_unified_gated_shadow_trades.csv rating_source_policy_coverage.csv rating_source_comparison.csv rating_data_source_audit.json rating_execution_separation_audit.json risk_budget_dual_track_validation.json risk_budget_signal_diff.csv risk_budget_dual_track_development_trades.csv risk_budget_dual_track_oos_shadow.csv v969_research_execution_trades.csv v969_formal_execution_trades.csv watch_portfolio_trades.csv research_portfolio_trades.csv qualified_portfolio_trades.csv sparse_expert_leaderboard.csv parameter_cluster_audit.csv policy_selection_comparison.csv seed_policy_comparison.csv selected_policy.json data_audit.json blind_month_registry.csv blind_expert_trade_ledger.csv blind_risk_budget_trade_ledger.csv blind_evidence_progress.json blind_integrity_audit.json blind_provisional_tier_audit.csv blind_decision_readiness.json; do
            test -f "results_v9_7_0/$f"
          done
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('results_v9_7_0')
          s = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          q = json.loads((root / 'quad_track_validation.json').read_text(encoding='utf-8'))
          d = json.loads((root / 'rating_data_source_audit.json').read_text(encoding='utf-8'))
          b = json.loads((root / 'risk_budget_dual_track_validation.json').read_text(encoding='utf-8'))
          g = json.loads((root / 'signal_selection_independence_audit.json').read_text(encoding='utf-8'))
          r = json.loads((root / 'snapshot_replay_audit.json').read_text(encoding='utf-8'))
          coverage = pd.read_csv(root / 'rating_source_policy_coverage.csv')
          blind = json.loads((root / 'blind_evidence_progress.json').read_text(encoding='utf-8'))
          integrity = json.loads((root / 'blind_integrity_audit.json').read_text(encoding='utf-8'))

          assert s['engine'] == 'BTC 5m frozen baseline and append-only blind evidence accumulation V9.7.0'
          assert s['release_version'] == '9.7.0'
          assert s['qualified'] is False and s['not_for_live_trading'] is True
          assert s['rating_data_source_unified'] is True
          assert s['rating_source_expert_coverage_complete'] is True
          assert s['rating_source_policy_coverage_complete'] is True
          assert s['rating_source_feature_frame_coverage_complete'] is True
          assert s['rating_source_feature_frame_index_match'] is True
          assert s['rating_source_required_expert_count'] == 40
          assert s['rating_source_covered_expert_count'] == 40
          assert s['rating_source_matches_no_budget_lane'] is True
          assert s['rating_metrics_match_no_budget_lane'] is True
          assert s['rating_ignores_execution_budget'] is True
          assert s['risk_budget_dual_track_enabled'] is True
          assert s['risk_budget_winner_selection_enabled'] is False
          assert s['blind_start_month'] == '2026-07'
          assert s['blind_winner_selection_enabled'] is False
          assert s['blind_automatic_tier_activation_enabled'] is False
          assert s['signal_selection_independent_of_tier'] is True
          assert d['core_fixed_penalty_shadow_for_final_tier'] is False
          assert d['expert_id_coverage_complete'] is True
          assert d['policy_coverage_complete'] is True
          assert d['feature_frame_coverage_complete'] is True
          assert d['feature_frame_index_match'] is True
          assert d['required_expert_count'] == 40
          assert d['covered_expert_count'] == 40
          assert set(d['required_expert_ids']) == set(range(40))
          assert set(d['covered_expert_ids']) == set(range(40))
          assert d['seed_rating_source_matches_no_budget_lane'] is True
          assert len(coverage) == 40
          assert coverage['expert_id'].astype(int).nunique() == 40
          assert coverage['expert_found_in_rating_engine'].astype(bool).all()
          assert coverage['policy_found_in_rating_engine'].astype(bool).all()
          assert coverage['feature_frame_column_found'].astype(bool).all()
          assert coverage['required_mask_column'].astype(str).str.startswith('sparse_').all()
          assert set(coverage.loc[coverage['expert_id'].astype(int) < 32, 'rating_engine']) == {'V9.6.1_REFERENCE'}
          assert set(coverage.loc[coverage['expert_id'].astype(int) >= 32, 'rating_engine']) == {'V9.6.9_FROZEN_EXTENDED_ORIGINAL'}
          assert set(coverage.loc[coverage['expert_id'].astype(int) < 32, 'feature_frame']) == {'V9.6.1_REFERENCE_FEATURES'}
          assert set(coverage.loc[coverage['expert_id'].astype(int) >= 32, 'feature_frame']) == {'V9.6.9_FROZEN_EXTENDED_FEATURES'}
          assert b['winner_decision'] == 'NO_WINNER_SELECTION_FROM_SEEN_OOS'
          assert b['rating_is_independent_of_risk_budget'] is True
          assert q['winner_decision'] == 'NO_WINNER_SELECTION_FROM_SEEN_OOS'
          assert len(q['lanes']) == 4
          assert g['signal_selection_independent_of_tier'] is True
          assert r['exact_match'] is True
          assert sum(s['tier_counts'].values()) == 40
          assert blind['blind_start_month'] == '2026-07'
          assert blind['winner_selection_enabled'] is False
          assert blind['automatic_tier_activation_enabled'] is False
          assert integrity['append_only_enabled'] is True
          assert integrity['expert_ledger']['append_only_pass'] is True
          assert integrity['risk_budget_ledger']['append_only_pass'] is True
          print(json.dumps({
              'tiers': s['tier_counts'],
              'covered_experts': s['rating_source_covered_expert_count'],
              'rating_source': s['rating_source_lane'],
              'risk_lanes': list(b['lanes'])
          }, ensure_ascii=False, indent=2))
          PYCODE

      - name: Upload V9.7.0 results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-7-0-blind-evidence-results
          path: results_v9_7_0/
          retention-days: 30

      - name: Commit readable V9.7.0 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_7_0
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V9.7.0 blind-evidence result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
