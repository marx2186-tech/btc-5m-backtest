name: BTC 5m V9.2 cross-month calibrated backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v9_2.py"
      - "request.v9_2.json"
      - ".github/workflows/v9-2-cross-month-calibrated-backtest.yml"

permissions:
  contents: write

concurrency:
  group: btc-5m-v9-2-cross-month-calibrated
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3 numba==0.60.0 scikit-learn==1.5.1 pyyaml==6.0.2

      - name: Verify exact V9.2 source and request
        shell: bash
        run: |
          set -euo pipefail
          test -f autonomous_backtest_v9_2.py
          test -f request.v9_2.json
          test -f .github/workflows/v9-2-cross-month-calibrated-backtest.yml
          script_actual="$(sha256sum autonomous_backtest_v9_2.py | awk '{print $1}')"
          request_actual="$(sha256sum request.v9_2.json | awk '{print $1}')"
          script_expected="88d9e8392da80e7abc4001f52e104f81dfc0eb6ed2e107d64d671743f78fad7f"
          request_expected="8cfa21876e81b7b3615b3af84627bb9544e3eea51688cf2ca9f1dfb132598342"
          echo "script_sha256=$script_actual"
          echo "request_sha256=$request_actual"
          test "$script_actual" = "$script_expected"
          test "$request_actual" = "$request_expected"
          grep -F 'ENGINE_VERSION = "V9.2"' autonomous_backtest_v9_2.py
          grep -F 'RESULTS = ROOT / "results_v9_2"' autonomous_backtest_v9_2.py
          grep -F 'OOS_MONTH = "2026-06"' autonomous_backtest_v9_2.py
          grep -F 'class CalibratedExpertModel' autonomous_backtest_v9_2.py
          grep -F 'calibration_month = ordered_months[-1]' autonomous_backtest_v9_2.py
          grep -F 'Append every observed candidate score after making the decision' autonomous_backtest_v9_2.py
          grep -F 'assert_oos_isolation' autonomous_backtest_v9_2.py

      - name: Python syntax and offline regression tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_2.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v9_2.py
          python autonomous_backtest_v9_2.py --self-test 2>&1 | tee v9-2-self-test.log
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = Path('.github/workflows/v9-2-cross-month-calibrated-backtest.yml')
          parsed = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          assert isinstance(parsed, dict)
          assert 'jobs' in parsed and 'backtest' in parsed['jobs']
          print('YAML_PARSE_OK')
          PY

      - name: Run V9.2 backtest
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v9_2.json
        run: |
          set -o pipefail
          python autonomous_backtest_v9_2.py 2>&1 | tee v9-2-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-2-failure-diagnostics
          path: |
            v9-2-self-test.log
            v9-2-run.log
            results_v9_2/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V9.2 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f results_v9_2/status.json
          test -f results_v9_2/report.md
          test -f results_v9_2/trades.csv
          test -f results_v9_2/candidate_leaderboard.csv
          test -f results_v9_2/expert_candidate_leaderboard.csv
          test -f results_v9_2/signal_funnel.csv
          test -f results_v9_2/signal_funnel.json
          test -f results_v9_2/selected_policy.json
          test -f results_v9_2/data_audit.json
          test -f results_v9_2/run_identity.txt
          grep -F 'BTC 5m cross-month calibrated expert ensemble V9.2' results_v9_2/run_identity.txt
          grep -F 'oos=2026-06' results_v9_2/run_identity.txt
          grep -F 'output=results_v9_2' results_v9_2/run_identity.txt
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('results_v9_2/status.json').read_text(encoding='utf-8'))
          assert status['engine'] == 'BTC 5m cross-month calibrated expert ensemble V9.2'
          assert status['oos_month'] == '2026-06'
          assert status['selection_status'] in {'VALID_POLICY', 'EXPERIMENTAL_FALLBACK'}
          if status['selection_status'] == 'EXPERIMENTAL_FALLBACK':
              assert status['not_for_live_trading'] is True
              assert status['qualified'] is False
          isolation = status['oos_isolation']
          assert isolation['used_for_training'] is False
          assert isolation['used_for_thresholds'] is False
          assert isolation['used_for_expert_elimination'] is False
          assert isolation['used_for_combination_selection'] is False
          assert isolation['evaluation_occurs_after_policy_freeze'] is True
          assert isolation['oos_funnel_diagnostics_computed_after_policy_freeze'] is True
          assert status['constraints']['fee_rate_per_side'] == 0.0005
          assert status['constraints']['slippage_per_fill_usdt'] == 0.2
          assert status['constraints']['online_rank_window'] == 500
          assert status['constraints']['calibration_min_rows'] == 24
          assert set(status['expert_stats']) == {'2026-05', '2026-06'}
          for month, experts in status['threshold_audit'].items():
              for name, audit in experts.items():
                  if audit.get('model_available'):
                      assert 'calibration_month' in audit
                      assert 'calibration_brier' in audit
                      assert 'score_drift' in audit
          print(json.dumps(status['monthly_stats'], ensure_ascii=False, indent=2))
          PY

      - name: Upload V9.2 result artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-v9-2-results
          path: results_v9_2/
          retention-days: 30

      - name: Commit readable V9.2 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v9_2
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Add V9.2 calibrated result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
