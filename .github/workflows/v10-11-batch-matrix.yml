name: BTCUSDT V10.11 34-channel batch matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v10_11.py"
      - "_v111_engine.py"
      - "_v110_engine.py"
      - "_v109_engine.py"
      - "_v108_engine.py"
      - "_v106_engine.py"
      - "_v105_engine.py"
      - "_v104_engine.py"
      - "_v103_engine.py"
      - "_v102_engine.py"
      - "request.v10_11.json"
      - ".github/workflows/v10-11-batch-matrix.yml"

permissions:
  contents: write

concurrency:
  group: btcusdt-v10-11-batch-matrix
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3

      - name: Verify exact V10.11 files
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum autonomous_backtest_v10_11.py | awk '{print $1}')" = "6a8f685965118410f4133720e77718419063ee54984405f02ec4f48bc2b5e861"
          test "$(sha256sum _v111_engine.py | awk '{print $1}')" = "b973f77e344c4c315d7b134391b1c1c95beadd7ef4a6b3d5013bc44f498eb59b"
          test "$(sha256sum _v110_engine.py | awk '{print $1}')" = "8c707c457494b42bbd207be18af36b2e21ae1be433d18207a5d34bba3f6bf311"
          test "$(sha256sum _v109_engine.py | awk '{print $1}')" = "e88920a5ed68ec5e956f91adffb604a280be8c9d5c7244aacff510b5273bc94a"
          test "$(sha256sum _v108_engine.py | awk '{print $1}')" = "687eb295f7da839bd5d29d6fab170a16fc18a0f66d0dc645a78d1ee9cf07a780"
          test "$(sha256sum _v106_engine.py | awk '{print $1}')" = "2e671f05bee77265ecfa861fc0e0638ed1b2da37b193962aa1107dd96d6bf028"
          test "$(sha256sum _v105_engine.py | awk '{print $1}')" = "47e0e5c0d4c88690303e04d91440930f904d3497fd769408a10df7e7fd5a23e1"
          test "$(sha256sum _v104_engine.py | awk '{print $1}')" = "e17735548f938590e423c779c1649b5acb6aeed52920459ca78bdb3f73c33e02"
          test "$(sha256sum _v103_engine.py | awk '{print $1}')" = "bf6946d9ebf38024c3eb4a208336be5f080e0d04145034050ec2639eee7a59e3"
          test "$(sha256sum _v102_engine.py | awk '{print $1}')" = "c1e59bc04f0ad7d84bdba9691cfb93d56ecc36a182d722fb18494bd6ff990328"
          test "$(sha256sum request.v10_11.json | awk '{print $1}')" = "cc690955e8727504371f5aecf1ae4f15e81c6b36aa4deb4cf199c63d356769e2"
          grep -F '"version": "10.11"' request.v10_11.json
          grep -F '"channel_count": 34' request.v10_11.json
          grep -F '"fixed_directional_channels": 18' request.v10_11.json
          grep -F '"fixed_shared_channels": 9' request.v10_11.json
          grep -F '"break_even_shadow_channels": 6' request.v10_11.json
          grep -F '"upper_state_machine_identical_to_v10_9": true' request.v10_11.json
          grep -F '"same_confirmation_pool_for_all_experiments": true' request.v10_11.json
          grep -F '"multiplier": 1.5' request.v10_11.json
          ! grep -R -F 'fapi.binance.com' autonomous_backtest_v10_11.py _v111_engine.py _v110_engine.py _v109_engine.py _v108_engine.py _v106_engine.py _v105_engine.py _v104_engine.py _v103_engine.py _v102_engine.py request.v10_11.json

      - name: Syntax and offline tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v10_11.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v10_11.py _v111_engine.py _v110_engine.py _v109_engine.py _v108_engine.py _v106_engine.py _v105_engine.py _v104_engine.py _v103_engine.py _v102_engine.py
          python autonomous_backtest_v10_11.py --self-test 2>&1 | tee v10-11-self-test.log
          python autonomous_backtest_v10_11.py --pipeline-smoke 2>&1 | tee v10-11-pipeline-smoke.log

      - name: Run V10.11 real batch benchmark
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v10_11.json
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          rm -rf results_v10_11
          python autonomous_backtest_v10_11.py 2>&1 | tee v10-11-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-v10-11-failure-diagnostics
          path: |
            v10-11-self-test.log
            v10-11-pipeline-smoke.log
            v10-11-run.log
            results_v10_11/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V10.11 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in status.json report.md data_audit.json signal_audit.json qualification_audit.json strategy_spec.json run_identity.json run_identity.txt channel_summary.csv diagnostic_rank.csv direction_summary.csv monthly_summary.csv trigger_type_summary.csv exit_reason_summary.csv loss_diagnostics.csv management_comparison.csv cost_stress_summary.csv state_machine_funnel.csv state_machine_event_ledger.csv trigger_coverage.csv setup_signal_matrix.csv setup_channel_matrix.csv signal_counts.csv trade_ledger.csv; do
            test -f "results_v10_11/$f"
          done
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('results_v10_11')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'data_audit.json').read_text(encoding='utf-8'))
          signal_audit=json.loads((root/'signal_audit.json').read_text(encoding='utf-8'))
          summary=pd.read_csv(root/'channel_summary.csv')
          rank=pd.read_csv(root/'diagnostic_rank.csv')
          trades=pd.read_csv(root/'trade_ledger.csv')
          signals=pd.read_csv(root/'signal_counts.csv')
          cost=pd.read_csv(root/'cost_stress_summary.csv')
          management=pd.read_csv(root/'management_comparison.csv')
          setup_channels=pd.read_csv(root/'setup_channel_matrix.csv')

          assert status['release_version']=='10.11'
          assert status['historical_diagnostic_only'] is True
          assert status['qualified_for_live_trading'] is False
          assert status['parameter_optimization_enabled'] is False
          assert status['winner_selection_enabled'] is False
          assert status['channel_count']==34
          assert status['evaluation_start_utc']=='2026-01-01T00:00:00Z'
          assert status['evaluation_end_utc']=='2026-06-30T23:59:59Z'
          assert audit['passed'] is True
          assert audit['missing_rows']==0
          assert audit['duplicate_timestamps']==0
          assert audit['uses_rest_fallback'] is False
          assert len(summary)==34 and summary['channel_id'].nunique()==34
          assert len(signals)==34 and signals['channel_id'].nunique()==34
          assert len(cost)==34 and cost['channel_id'].nunique()==34
          assert len(rank)==33 and rank['channel_id'].nunique()==33
          assert len(management)==6
          assert (cost['cost_multiplier']==1.5).all()
          assert signal_audit['matrix']['channel_count']==34
          assert signal_audit['matrix']['fixed_directional_channels']==18
          assert signal_audit['matrix']['fixed_shared_channels']==9
          assert signal_audit['matrix']['break_even_shadow_channels']==6
          assert signal_audit['state_machine']['one_setup_per_cycle'] is True
          assert signal_audit['state_machine']['upper_state_machine_identical_to_v10_9'] is True
          assert signal_audit['trigger_comparison']['all_channels_use_same_confirmation_pool'] is True

          experiments=summary.loc[~summary['is_baseline'].astype(bool)]
          fixed=experiments.loc[experiments['management_mode']=='FIXED_STOP_TARGET']
          be=experiments.loc[experiments['management_mode']=='BE_AT_1R_NEXT_5M_BAR']
          assert len(fixed.loc[fixed['direction_variant'].isin(['long','short'])])==18
          assert len(fixed.loc[fixed['direction_variant']=='shared'])==9
          assert len(be)==6
          assert set(fixed['reward_risk'].round(1))=={1.5,2.0,2.5}
          assert set(be['reward_risk'].round(1))=={2.0}

          # Signal pools must be identical across RR values for the same entry/direction/management family.
          merged=signals.merge(summary[['channel_id','entry_mode','direction_variant','management_mode','reward_risk']],on='channel_id')
          fixed_counts=merged.loc[merged['management_mode']=='FIXED_STOP_TARGET'].groupby(['entry_mode','direction_variant'])['signals'].nunique()
          assert (fixed_counts==1).all()
          for _, row in management.iterrows():
              f=signals.loc[signals['channel_id']==row['fixed_channel_id'],'signals'].iloc[0]
              b=signals.loc[signals['channel_id']==row['be1_channel_id'],'signals'].iloc[0]
              assert int(f)==int(b)

          if not setup_channels.empty:
              assert setup_channels['channel_id'].isin(set(summary['channel_id'])).all()
              assert setup_channels['signal_emitted'].astype(bool).all()

          if not trades.empty:
              entries=pd.to_datetime(trades['entry_time_utc'],utc=True)
              exits=pd.to_datetime(trades['exit_time_utc'],utc=True)
              assert (entries>=pd.Timestamp('2026-01-01T00:00:00Z')).all()
              assert (entries<=pd.Timestamp('2026-06-30T23:59:59Z')).all()
              assert (exits>=entries).all()
              for channel_id, group in trades.groupby('channel_id'):
                  e=pd.to_datetime(group['entry_time_utc'],utc=True).reset_index(drop=True)
                  x=pd.to_datetime(group['exit_time_utc'],utc=True).reset_index(drop=True)
                  if len(group)>1:
                      assert (e.iloc[1:].reset_index(drop=True)>=x.iloc[:-1].reset_index(drop=True)).all(), channel_id

          print(summary[['channel_id','entry_mode','direction_variant','management_mode','reward_risk','trades','win_rate','profit_factor','net_R','max_drawdown_R','max_consecutive_losses','cost_1_5x_profit_factor']].to_string(index=False))
          PYCODE

      - name: Upload V10.11 results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-v10-11-34-channel-batch-results
          path: results_v10_11/
          retention-days: 30

      - name: Commit readable V10.11 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v10_11
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V10.11 batch matrix result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
