name: BTCUSDT V10.6 frozen cross-year untouched holdout validation

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_backtest_v10_6.py"
      - "_v106_engine.py"
      - "_v105_engine.py"
      - "_v104_engine.py"
      - "_v103_engine.py"
      - "_v102_engine.py"
      - "request.v10_6.json"
      - ".github/workflows/v10-6-frozen-cross-year-unseen-holdout.yml"

permissions:
  contents: write

concurrency:
  group: btcusdt-v10-6-frozen-cross-year-unseen-holdout
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.2 requests==2.32.3

      - name: Verify exact V10.6 files
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum autonomous_backtest_v10_6.py | awk '{print $1}')" = "5ea8f9f02245a59ac02e85c87bea6bb71df0e33923726041f5e465e5684f5744"
          test "$(sha256sum _v106_engine.py | awk '{print $1}')" = "2e671f05bee77265ecfa861fc0e0638ed1b2da37b193962aa1107dd96d6bf028"
          test "$(sha256sum _v105_engine.py | awk '{print $1}')" = "47e0e5c0d4c88690303e04d91440930f904d3497fd769408a10df7e7fd5a23e1"
          test "$(sha256sum _v104_engine.py | awk '{print $1}')" = "e17735548f938590e423c779c1649b5acb6aeed52920459ca78bdb3f73c33e02"
          test "$(sha256sum _v103_engine.py | awk '{print $1}')" = "bf6946d9ebf38024c3eb4a208336be5f080e0d04145034050ec2639eee7a59e3"
          test "$(sha256sum _v102_engine.py | awk '{print $1}')" = "c1e59bc04f0ad7d84bdba9691cfb93d56ecc36a182d722fb18494bd6ff990328"
          test "$(sha256sum request.v10_6.json | awk '{print $1}')" = "9f93d58799d7f01813559856b0a726d65230461bb71a65a59c17a3c7d62a487a"
          grep -F '"parameters_fully_frozen": true' request.v10_6.json
          grep -F '"parameter_optimization_enabled": false' request.v10_6.json
          grep -F '"contains_unseen_postperiod_holdout": true' request.v10_6.json
          grep -F '"start_utc": "2026-07-01T00:00:00Z"' request.v10_6.json
          grep -F '"end_utc": "2026-07-26T23:59:59Z"' request.v10_6.json
          grep -F 'NEXT_5M_OPEN_AFTER_CLOSED_1H_SIGNAL_BAR' request.v10_6.json
          grep -F 'STOP_FIRST_CONSERVATIVE' request.v10_6.json
          ! grep -R -F 'fapi.binance.com' autonomous_backtest_v10_6.py _v106_engine.py _v105_engine.py _v104_engine.py _v103_engine.py _v102_engine.py request.v10_6.json

      - name: Syntax and offline tests
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v10_6.json
        run: |
          set -euo pipefail
          python -m py_compile autonomous_backtest_v10_6.py _v106_engine.py _v105_engine.py _v104_engine.py _v103_engine.py _v102_engine.py
          python autonomous_backtest_v10_6.py --self-test 2>&1 | tee v10-6-self-test.log
          python autonomous_backtest_v10_6.py --pipeline-smoke 2>&1 | tee v10-6-pipeline-smoke.log
          python - <<'PYCODE'
          import json
          from pathlib import Path
          request=json.loads(Path('request.v10_6.json').read_text(encoding='utf-8'))
          assert request['release']['version']=='10.6'
          assert request['release']['parameters_fully_frozen'] is True
          assert request['release']['parameter_optimization_enabled'] is False
          assert request['release']['contains_historical_backcast'] is True
          assert request['release']['contains_unseen_postperiod_holdout'] is True
          assert request['release']['contains_true_prospective_data'] is False
          assert request['channel_count']==3
          assert request['directional_channel_count']==2
          assert request['portfolio_channel_count']==1
          assert len(request['channels'])==3
          assert request['winner_selection_enabled'] is False
          assert request['qualified_for_live_trading'] is False
          assert len(request['phases'])==7
          assert len(request['cost_stress_scenarios'])==3
          print('V106_CONFIG_OK')
          PYCODE

      - name: Run V10.6 real frozen validation
        shell: bash
        env:
          BACKTEST_REQUEST_FILE: request.v10_6.json
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          rm -rf results_v10_6
          python autonomous_backtest_v10_6.py 2>&1 | tee v10-6-run.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-v10-6-failure-diagnostics
          path: |
            v10-6-self-test.log
            v10-6-pipeline-smoke.log
            v10-6-run.log
            results_v10_6/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify V10.6 outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for f in status.json report.md benchmark_summary.json data_audit.json signal_and_portfolio_audit.json robustness_audit.json parameter_lock.json future_validation_manifest.json v10_5_replay_audit.json strategy_spec.json run_identity.json run_identity.txt channel_summary.csv phase_summary.csv yearly_summary.csv monthly_summary.csv direction_summary.csv portfolio_component_summary.csv rolling_3m_summary.csv rolling_6m_summary.csv rolling_12m_summary.csv year_removal_robustness.csv cost_stress_summary.csv trade_ledger.csv warmup_sensitivity_audit.csv signal_counts.csv portfolio_overlap_audit.csv unseen_holdout_trade_diagnostics.csv; do
            test -f "results_v10_6/$f"
          done
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('results_v10_6')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'data_audit.json').read_text(encoding='utf-8'))
          replay=json.loads((root/'v10_5_replay_audit.json').read_text(encoding='utf-8'))
          lock=json.loads((root/'parameter_lock.json').read_text(encoding='utf-8'))
          summary=pd.read_csv(root/'channel_summary.csv')
          phases=pd.read_csv(root/'phase_summary.csv')
          years=pd.read_csv(root/'yearly_summary.csv')
          stress=pd.read_csv(root/'cost_stress_summary.csv')
          trades=pd.read_csv(root/'trade_ledger.csv')
          overlap=pd.read_csv(root/'portfolio_overlap_audit.csv')
          warmup=pd.read_csv(root/'warmup_sensitivity_audit.csv')
          unseen=pd.read_csv(root/'unseen_holdout_trade_diagnostics.csv')
          assert status['release_version']=='10.6'
          assert status['parameters_frozen'] is True
          assert status['parameter_optimization_enabled'] is False
          assert status['qualified_for_live_trading'] is False
          assert status['winner_selection_enabled'] is False
          assert status['channel_count']==3
          assert status['v10_5_reference_replay_passed'] is True
          assert replay['passed'] is True
          assert status['parameter_lock_sha256']==lock['parameter_lock_sha256']
          assert audit['passed'] is True
          assert audit['missing_rows']==0
          assert audit['duplicate_timestamps']==0
          assert audit['uses_rest_fallback'] is False
          assert len(audit['unseen_daily_files'])==26
          assert len(summary)==3 and summary['channel_id'].nunique()==3
          assert set(summary['direction_scope'])=={'LONG','SHORT','BOTH'}
          assert len(phases)==21 and phases['phase'].nunique()==7
          assert len(years)==21 and years['year'].nunique()==7
          assert len(stress)==9 and stress['scenario_id'].nunique()==3
          assert len(overlap)==1
          assert len(warmup)==3
          if not trades.empty:
              entries=pd.to_datetime(trades['entry_time_utc'],utc=True)
              signals=pd.to_datetime(trades['signal_time_utc'],utc=True)
              exits=pd.to_datetime(trades['exit_time_utc'],utc=True)
              assert (entries>=signals).all()
              assert (exits>=entries).all()
              for channel_id, group in trades.groupby('channel_id'):
                  e=pd.to_datetime(group['entry_time_utc'],utc=True).reset_index(drop=True)
                  x=pd.to_datetime(group['exit_time_utc'],utc=True).reset_index(drop=True)
                  if len(group)>1:
                      assert (e.iloc[1:].reset_index(drop=True)>=x.iloc[:-1].reset_index(drop=True)).all(), channel_id
          if not unseen.empty:
              p=pd.to_datetime(unseen['entry_time_utc'],utc=True)
              assert (p>=pd.Timestamp('2026-07-01T00:00:00Z')).all()
              assert (p<=pd.Timestamp('2026-07-26T23:59:59Z')).all()
          print(json.dumps({
              'portfolio_pass':status['portfolio_cross_year_validation_pass'],
              'unseen_holdout_trades':status['unseen_holdout_portfolio_trades'],
              'unseen_holdout_net_R':status['unseen_holdout_portfolio_net_R']
          },ensure_ascii=False,indent=2))
          PYCODE

      - name: Upload V10.6 results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-v10-6-frozen-cross-year-unseen-holdout-results
          path: results_v10_6/
          retention-days: 30

      - name: Commit readable V10.6 results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_v10_6
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add V10.6 frozen validation result $(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }} [skip ci]"
          git push
